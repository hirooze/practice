<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
  <defs>
    <style type="text/css">
      .package { fill: #f0f0f0; stroke: #000; stroke-width: 1; }
      .component { fill: #fff; stroke: #000; stroke-width: 1; }
      text { font-family: Arial, sans-serif; font-size: 12px; }
    </style>
  </defs>
  <g id="msr">
    <rect x="10" y="10" width="780" height="580" class="package"/>
    <text x="20" y="30" font-weight="bold">msr</text>
    
    <g id="etc">
      <rect x="30" y="50" width="150" height="100" class="package"/>
      <text x="40" y="70" font-weight="bold">etc</text>
      <rect x="40" y="80" width="130" height="20" class="component"/>
      <text x="50" y="92">pattern.conf</text>
      <rect x="40" y="105" width="130" height="20" class="component"/>
      <text x="50" y="117">msr.conf</text>
    </g>
    
    <g id="lib">
      <rect x="200" y="50" width="150" height="100" class="package"/>
      <text x="210" y="70" font-weight="bold">lib</text>
      <rect x="210" y="80" width="130" height="20" class="component"/>
      <text x="220" y="92">help.md</text>
      <rect x="210" y="105" width="130" height="20" class="component"/>
      <text x="220" y="117">README.md</text>
      <rect x="210" y="130" width="130" height="20" class="component"/>
      <text x="220" y="142">version.md</text>
    </g>
    
    <g id="bin">
      <rect x="370" y="50" width="400" height="520" class="package"/>
      <text x="380" y="70" font-weight="bold">bin</text>
      
      <rect x="380" y="80" width="130" height="20" class="component"/>
      <text x="390" y="92">msr.rs</text>
      
      <g id="main">
        <rect x="390" y="110" width="150" height="80" class="package"/>
        <text x="400" y="125" font-weight="bold">main</text>
        <rect x="400" y="135" width="130" height="20" class="component"/>
        <text x="410" y="147">main.rs</text>
        <g id="task">
          <rect x="410" y="160" width="110" height="20" class="package"/>
          <text x="420" y="172" font-weight="bold">task</text>
          <rect x="420" y="175" width="90" height="15" class="component"/>
          <text x="425" y="185">task_main.rs</text>
        </g>
      </g>
      
      <g id="options">
        <rect x="560" y="110" width="190" height="400" class="package"/>
        <text x="570" y="125" font-weight="bold">options</text>
        <!-- add, del, clear, list, export, import, help, version のサブパッケージ -->
        <text x="580" y="145">add, del, clear, list,</text>
        <text x="580" y="160">export, import, help, version</text>
        <text x="580" y="175">各サブパッケージに</text>
        <text x="580" y="190">main.rs と task/ サブディレクトリ</text>
      </g>
    </g>
  </g>
</svg>